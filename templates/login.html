<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Navkis Auditorium Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

<div class="login-page">
    <div class="login-brand">
        <img class="login-college-logo" src="{{ url_for('static', filename='college_logo.png') }}" alt="Navkis College of Engineering logo">
        <div>
            <div class="login-brand-title">Navkis Auditorium Booking</div>
            <div class="login-brand-sub">Navkis College of Engineering, Hassan</div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-heading">
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Sign in</h1>
            <p>Login to manage auditorium bookings and schedules.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">
            <label>Login as</label>
            <div class="role-selector">
                <label class="role-option">
                    <input type="radio" name="role" value="user" checked>
                    <span class="role-card">
                        <strong>👤 User</strong>
                        <small>Book and manage your bookings</small>
                    </span>
                </label>
                <label class="role-option">
                    <input type="radio" name="role" value="admin">
                    <span class="role-card">
                        <strong>🛡 Admin</strong>
                        <small>Manage users and booking requests</small>
                    </span>
                </label>
            </div>

            <label>Username</label>
            <div class="input-wrap">
                <span>♙</span>
                <input type="text" name="username" placeholder="Enter username" required autofocus>
            </div>

            <label>Password</label>
            <div class="input-wrap">
                <span>●</span>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <button class="btn btn-primary btn-large" type="submit">
                Sign In <span>→</span>
            </button>
        </form>
    </div>

    <div class="login-footer">© 2026 Navkis Auditorium Booking</div><div class="site-watermark login-watermark" aria-hidden="true">FALCON TECH</div>
</div>

</body>
</html>
